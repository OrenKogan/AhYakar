<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AhYakar — Medical Assistant</title>
    <meta name="description" content="AhYakar: your AI-powered medical assistant for symptom analysis and appointment scheduling.">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
    <style>
        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

        :root {
            --green-dark:  #00574a;
            --green-mid:   #007a65;
            --green-light: #00a884;
            --bg:          #0b1218;
            --surface:     #111b21;
            --surface2:    #202c33;
            --surface3:    #2a3942;
            --text:        #e9edef;
            --text-dim:    #8696a0;
            --user-bubble: #005c4b;
            --bot-bubble:  #202c33;
            --accent:      #00a884;
            --warning:     #f0c04a;
            --danger:      #ea4848;
            --radius:      18px;
            --transition:  0.2s ease;
        }

        body {
            font-family: 'Inter', 'Segoe UI', sans-serif;
            background: var(--bg);
            color: var(--text);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        /* ── Chat shell ──────────────────────────────────────────────────── */
        .shell {
            width: 100%;
            max-width: 480px;
            height: 100vh;
            display: flex;
            flex-direction: column;
            background: var(--surface);
        }

        /* ── Header ──────────────────────────────────────────────────────── */
        .header {
            background: var(--surface2);
            padding: 14px 20px;
            display: flex;
            align-items: center;
            gap: 14px;
            border-bottom: 1px solid var(--surface3);
            flex-shrink: 0;
        }
        .avatar {
            width: 42px;
            height: 42px;
            border-radius: 50%;
            background: linear-gradient(135deg, var(--green-mid), var(--accent));
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.3rem;
            flex-shrink: 0;
        }
        .header-info h1 { font-size: 1rem; font-weight: 600; }
        .header-info p  { font-size: 0.75rem; color: var(--text-dim); }

        /* agent pipeline badge */
        .pipeline-badge {
            margin-left: auto;
            display: flex;
            gap: 6px;
            align-items: center;
        }
        .step-dot {
            width: 8px; height: 8px;
            border-radius: 50%;
            background: var(--surface3);
            transition: background var(--transition), transform var(--transition);
        }
        .step-dot.active  { background: var(--accent); transform: scale(1.3); }
        .step-dot.done    { background: var(--green-dark); }

        /* ── Messages ─────────────────────────────────────────────────────── */
        .messages {
            flex: 1;
            overflow-y: auto;
            padding: 20px 16px;
            display: flex;
            flex-direction: column;
            gap: 6px;
            scroll-behavior: smooth;
        }
        .messages::-webkit-scrollbar { width: 4px; }
        .messages::-webkit-scrollbar-thumb { background: var(--surface3); border-radius: 4px; }

        .row {
            display: flex;
            flex-direction: column;
            max-width: 85%;
        }
        .row.user  { align-self: flex-end; align-items: flex-end; }
        .row.bot   { align-self: flex-start; align-items: flex-start; }

        .bubble {
            padding: 10px 14px;
            border-radius: var(--radius);
            line-height: 1.55;
            font-size: 0.9rem;
            word-break: break-word;
            white-space: pre-wrap;
        }
        .row.user .bubble {
            background: var(--user-bubble);
            border-bottom-right-radius: 4px;
        }
        .row.bot .bubble {
            background: var(--bot-bubble);
            border-bottom-left-radius: 4px;
        }

        .bubble strong { font-weight: 600; }
        .bubble em     { color: var(--text-dim); font-style: normal; font-size: 0.82rem; }

        /* severity pill */
        .severity-pill {
            font-size: 0.7rem;
            font-weight: 600;
            padding: 2px 8px;
            border-radius: 99px;
            margin-bottom: 4px;
            display: inline-block;
            letter-spacing: 0.04em;
            text-transform: uppercase;
        }
        .sev-low      { background: #1a3a2e; color: #4caf87; }
        .sev-moderate { background: #2e2a10; color: var(--warning); }
        .sev-high     { background: #2e1a10; color: #f08050; }
        .sev-emergency{ background: #2e1010; color: var(--danger); }

        /* ── Typing indicator ─────────────────────────────────────────────── */
        .typing-row { align-self: flex-start; }
        .typing-bubble {
            background: var(--bot-bubble);
            border-radius: var(--radius);
            border-bottom-left-radius: 4px;
            padding: 12px 16px;
            display: flex;
            flex-direction: column;
            gap: 6px;
        }
        .typing-steps {
            display: flex;
            flex-direction: column;
            gap: 4px;
        }
        .typing-step {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 0.82rem;
            color: var(--text-dim);
            opacity: 0;
            transform: translateY(4px);
            transition: opacity 0.3s ease, transform 0.3s ease;
        }
        .typing-step.visible {
            opacity: 1;
            transform: translateY(0);
        }
        .typing-step.done-step { color: var(--text-dim); }
        .typing-step.done-step .step-icon { color: var(--accent); }
        .typing-step.active-step { color: var(--text); }
        .step-icon { font-size: 0.9rem; width: 1.2em; text-align: center; }
        .spinner {
            width: 10px; height: 10px;
            border: 2px solid var(--surface3);
            border-top-color: var(--accent);
            border-radius: 50%;
            animation: spin 0.7s linear infinite;
        }
        @keyframes spin { to { transform: rotate(360deg); } }

        /* ── Confirm/Decline card ─────────────────────────────────────────── */
        .confirm-card {
            background: var(--bot-bubble);
            border: 1px solid var(--surface3);
            border-radius: var(--radius);
            border-bottom-left-radius: 4px;
            overflow: hidden;
        }
        .confirm-card .proposal-text {
            padding: 12px 14px;
            font-size: 0.9rem;
            line-height: 1.55;
        }
        .confirm-actions {
            display: flex;
            border-top: 1px solid var(--surface3);
        }
        .confirm-btn {
            flex: 1;
            padding: 12px;
            border: none;
            cursor: pointer;
            font-family: inherit;
            font-size: 0.88rem;
            font-weight: 600;
            transition: background var(--transition);
        }
        .confirm-btn.yes {
            background: var(--green-dark);
            color: #fff;
            border-right: 1px solid var(--surface3);
        }
        .confirm-btn.yes:hover { background: var(--green-mid); }
        .confirm-btn.no {
            background: transparent;
            color: var(--text-dim);
        }
        .confirm-btn.no:hover { background: var(--surface3); color: var(--text); }
        .confirm-btn:disabled { opacity: 0.4; cursor: not-allowed; }

        /* ── Input area ───────────────────────────────────────────────────── */
        .input-area {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 12px 16px;
            background: var(--surface2);
            border-top: 1px solid var(--surface3);
            flex-shrink: 0;
        }
        #userInput {
            flex: 1;
            background: var(--surface3);
            border: none;
            border-radius: 24px;
            padding: 11px 18px;
            color: var(--text);
            font-family: inherit;
            font-size: 0.9rem;
            outline: none;
            transition: background var(--transition);
        }
        #userInput::placeholder { color: var(--text-dim); }
        #userInput:focus { background: #344047; }

        #sendBtn {
            width: 44px; height: 44px;
            border-radius: 50%;
            border: none;
            background: var(--accent);
            color: #fff;
            font-size: 1.1rem;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: background var(--transition), transform var(--transition);
            flex-shrink: 0;
        }
        #sendBtn:hover  { background: var(--green-mid); }
        #sendBtn:active { transform: scale(0.93); }
        #sendBtn:disabled { background: var(--surface3); cursor: not-allowed; }
    </style>
</head>
<body>

<main class="shell" role="main">
    <!-- Header -->
    <header class="header">
        <div class="avatar" aria-hidden="true">🩺</div>
        <div class="header-info">
            <h1>AhYakar Health Bot</h1>
            <p id="headerStatus">AI Medical Assistant</p>
        </div>
        <div class="pipeline-badge" title="Agent pipeline status" aria-label="Pipeline steps">
            <div class="step-dot" id="dot1" title="Intake Analyst"></div>
            <div class="step-dot" id="dot2" title="Medical Advisor"></div>
            <div class="step-dot" id="dot3" title="Appointment Planner"></div>
            <div class="step-dot" id="dot4" title="Executor"></div>
        </div>
    </header>

    <!-- Messages -->
    <section class="messages" id="chatBox" aria-live="polite" aria-label="Chat messages">
        <div class="row bot">
            <div class="bubble">
                Hello! I'm the <strong>AhYakar Medical AI</strong>. I can help with minor health concerns, suggest OTC medications, and schedule doctor appointments if needed.
                <br><br>
                How are you feeling today?
            </div>
        </div>
    </section>

    <!-- Input -->
    <div class="input-area">
        <input
            type="text"
            id="userInput"
            placeholder="Describe your symptoms…"
            aria-label="Your message"
            autocomplete="off"
        >
        <button id="sendBtn" aria-label="Send message" onclick="sendMessage()">➤</button>
    </div>
</main>

<script>
// ── Session ──────────────────────────────────────────────────────────────────
function getSessionId() {
    let id = localStorage.getItem('ahyakar_session_id');
    if (!id) {
        id = crypto.randomUUID();
        localStorage.setItem('ahyakar_session_id', id);
    }
    return id;
}
const SESSION_ID = getSessionId();

// ── Geolocation ───────────────────────────────────────────────────────────────
let userLocation = null;
if (navigator.geolocation) {
    navigator.geolocation.getCurrentPosition(
        pos => {
            userLocation = { lat: pos.coords.latitude, lng: pos.coords.longitude };
            console.log('[AhYakar] Location acquired:', userLocation);
        },
        err => {
            console.warn('[AhYakar] Geolocation unavailable:', err.message);
        }
    );
}

// ── DOM refs ─────────────────────────────────────────────────────────────────
const chatBox     = document.getElementById('chatBox');
const userInput   = document.getElementById('userInput');
const sendBtn     = document.getElementById('sendBtn');
const headerStatus = document.getElementById('headerStatus');
const dots = [
    document.getElementById('dot1'),
    document.getElementById('dot2'),
    document.getElementById('dot3'),
    document.getElementById('dot4'),
];

userInput.addEventListener('keydown', e => { if (e.key === 'Enter' && !e.shiftKey) sendMessage(); });

// ── Pipeline step dots ────────────────────────────────────────────────────────
function setDot(index, state) { // state: '' | 'active' | 'done'
    dots[index].className = 'step-dot' + (state ? ' ' + state : '');
}
function resetDots() { dots.forEach(d => d.className = 'step-dot'); }
function allDotsDone() { dots.forEach(d => d.className = 'step-dot done'); }

// ── Typing indicator ──────────────────────────────────────────────────────────
const STEPS = [
    { icon: '🔍', label: 'Triaging your condition…' },
    { icon: '🩻', label: 'Running clinical analysis…' },
    { icon: '📍', label: 'Finding nearest available doctor…' },
];

function createTypingEl() {
    const row = document.createElement('div');
    row.className = 'row bot typing-row';
    row.id = 'typingIndicator';

    const bubble = document.createElement('div');
    bubble.className = 'typing-bubble';

    const steps = document.createElement('div');
    steps.className = 'typing-steps';

    STEPS.forEach((s, i) => {
        const el = document.createElement('div');
        el.className = 'typing-step';
        el.id = `step${i}`;
        el.innerHTML = `<span class="step-icon">${s.icon}</span><span>${s.label}</span>`;
        steps.appendChild(el);
    });

    bubble.appendChild(steps);
    row.appendChild(bubble);
    return row;
}

let stepTimer = null;
function startTyping() {
    resetDots();
    const el = createTypingEl();
    chatBox.appendChild(el);
    scrollBottom();

    let current = 0;
    showStep(0);
    setDot(0, 'active');

    stepTimer = setInterval(() => {
        setDot(current, 'done');
        current++;
        if (current < STEPS.length) {
            showStep(current);
            setDot(current, 'active');
        } else {
            clearInterval(stepTimer);
        }
    }, 2500);
}

function showStep(i) {
    const el = document.getElementById(`step${i}`);
    if (el) {
        el.classList.add('visible', 'active-step');
        // Mark previous steps as done
        for (let j = 0; j < i; j++) {
            const prev = document.getElementById(`step${j}`);
            if (prev) { prev.classList.remove('active-step'); prev.classList.add('done-step'); }
        }
    }
}

function stopTyping() {
    clearInterval(stepTimer);
    const el = document.getElementById('typingIndicator');
    if (el) el.remove();
    resetDots();
    headerStatus.textContent = 'AI Medical Assistant';
}

// ── Scroll ────────────────────────────────────────────────────────────────────
function scrollBottom() {
    chatBox.scrollTop = chatBox.scrollHeight;
}

// ── Append helpers ────────────────────────────────────────────────────────────
function appendUserMessage(text) {
    const row = document.createElement('div');
    row.className = 'row user';
    const bubble = document.createElement('div');
    bubble.className = 'bubble';
    bubble.textContent = text;
    row.appendChild(bubble);
    chatBox.appendChild(row);
    scrollBottom();
}

function appendBotMessage(text, severity) {
    const row = document.createElement('div');
    row.className = 'row bot';

    if (severity && severity !== 'low') {
        const pill = document.createElement('div');
        const labelMap = { moderate: '⚠️ Moderate', high: '🔶 High', emergency: '🚨 Emergency' };
        const classMap = { moderate: 'sev-moderate', high: 'sev-high', emergency: 'sev-emergency' };
        pill.className = `severity-pill ${classMap[severity] || ''}`;
        pill.textContent = labelMap[severity] || severity;
        row.appendChild(pill);
    }

    const bubble = document.createElement('div');
    bubble.className = 'bubble';
    // Render simple markdown-ish: bold, italic/dim, line breaks
    bubble.innerHTML = renderText(text);
    row.appendChild(bubble);
    chatBox.appendChild(row);
    scrollBottom();
}

function appendProposalCard(proposalText, onConfirm, onDecline) {
    const row = document.createElement('div');
    row.className = 'row bot';

    const card = document.createElement('div');
    card.className = 'confirm-card';
    card.id = 'confirmCard';

    const textDiv = document.createElement('div');
    textDiv.className = 'proposal-text';
    textDiv.innerHTML = renderText(proposalText);
    card.appendChild(textDiv);

    const actions = document.createElement('div');
    actions.className = 'confirm-actions';

    const yesBtn = document.createElement('button');
    yesBtn.className = 'confirm-btn yes';
    yesBtn.id = 'confirmYes';
    yesBtn.textContent = '✅ Yes, book it';
    yesBtn.onclick = () => { disableConfirmCard(); onConfirm(); };

    const noBtn = document.createElement('button');
    noBtn.className = 'confirm-btn no';
    noBtn.id = 'confirmNo';
    noBtn.textContent = 'No thanks';
    noBtn.onclick = () => { disableConfirmCard(); onDecline(); };

    actions.appendChild(yesBtn);
    actions.appendChild(noBtn);
    card.appendChild(actions);
    row.appendChild(card);
    chatBox.appendChild(row);
    scrollBottom();
}

function disableConfirmCard() {
    const card = document.getElementById('confirmCard');
    if (card) {
        card.querySelectorAll('button').forEach(b => b.disabled = true);
    }
}

// ── Text renderer (simple markdown-ish) ──────────────────────────────────────
function renderText(text) {
    return text
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/\*\*(.*?)\*\*/g, '<strong>$1</strong>')
        .replace(/_(.*?)_/g, '<em>$1</em>')
        .replace(/\n---\n/g, '<hr style="border-color:var(--surface3);margin:8px 0">')
        .replace(/\n/g, '<br>');
}

// ── Lock/unlock input ─────────────────────────────────────────────────────────
function lockInput(status) {
    userInput.disabled = true;
    sendBtn.disabled = true;
    headerStatus.textContent = status || 'Processing…';
}
function unlockInput() {
    userInput.disabled = false;
    sendBtn.disabled = false;
    headerStatus.textContent = 'AI Medical Assistant';
    userInput.focus();
}

// ── Main send ─────────────────────────────────────────────────────────────────
async function sendMessage() {
    const text = userInput.value.trim();
    if (!text || userInput.disabled) return;

    userInput.value = '';
    appendUserMessage(text);
    lockInput('Analyzing…');
    startTyping();

    try {
        const res = await fetch('/api/chat', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ message: text, session_id: SESSION_ID, location: userLocation }),
        });
        const data = await res.json();
        stopTyping();

        if (data.error) {
            appendBotMessage('⚠️ ' + data.error);
            unlockInput();
            return;
        }

        // Show bot reply (no severity badge on new pipeline — stage-based)
        appendBotMessage(data.reply);

        if (data.stage === 'emergency') {
            resetDots();
            unlockInput();
            return;
        }

        allDotsDone();

        if (data.requires_confirm) {
            // Show Confirm/Decline buttons — the advisor's reply already contains the question
            appendConfirmButtons(
                () => handleConfirm(true),
                () => handleConfirm(false),
            );
            lockInput('Waiting for your decision…');
        } else {
            unlockInput();
        }

    } catch (err) {
        stopTyping();
        appendBotMessage('⚠️ Connection error. Is the server running?');
        unlockInput();
    }
}

// ── Confirm/Decline ───────────────────────────────────────────────────────────
function appendConfirmButtons(onConfirm, onDecline) {
    const row = document.createElement('div');
    row.className = 'row bot';

    const card = document.createElement('div');
    card.className = 'confirm-card';
    card.id = 'confirmCard';

    const actions = document.createElement('div');
    actions.className = 'confirm-actions';

    const yesBtn = document.createElement('button');
    yesBtn.className = 'confirm-btn yes';
    yesBtn.id = 'confirmYes';
    yesBtn.textContent = '📅 Yes, find me a doctor';
    yesBtn.onclick = () => { disableConfirmCard(); onConfirm(); };

    const noBtn = document.createElement('button');
    noBtn.className = 'confirm-btn no';
    noBtn.id = 'confirmNo';
    noBtn.textContent = 'No thanks';
    noBtn.onclick = () => { disableConfirmCard(); onDecline(); };

    actions.appendChild(yesBtn);
    actions.appendChild(noBtn);
    card.appendChild(actions);
    row.appendChild(card);
    chatBox.appendChild(row);
    scrollBottom();
}

async function handleConfirm(confirmed) {
    const label = confirmed ? '📅 Yes, find me a doctor' : 'No thanks';
    appendUserMessage(label);
    lockInput(confirmed ? 'Finding a doctor…' : 'Processing…');

    if (confirmed) {
        setDot(2, 'active');
        headerStatus.textContent = 'Finding nearest doctor…';
    }

    try {
        const res = await fetch('/api/confirm', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ session_id: SESSION_ID, confirmed }),
        });
        const data = await res.json();

        if (confirmed) { setDot(2, 'done'); setDot(3, 'done'); }

        if (data.error) {
            appendBotMessage('⚠️ ' + data.error);
        } else {
            appendBotMessage(data.reply);
        }

    } catch (err) {
        appendBotMessage('⚠️ Connection error during booking.');
    } finally {
        unlockInput();
    }
}
</script>

</body>
</html>
